name: Release

on:
    push:
        branches:
            - main

env:
    ITCH_USERNAME: mekstuff
    ITCH_GAME_ID: rutus

    ROBLOX_PLUGIN_ID: 89804562140178

    ROBLOX_UNIVERSE_ID: 8203353679
    ROBLOX_PLACE_ID: 137885571653335

jobs:
    get-next-version:
        permissions:
            contents: write
            issues: write
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - run: yarn install --frozen-lockfile
            - run: npx semantic-release --dry-run
              id: get-next-version
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        outputs:
            next-version: ${{ steps.get-next-version.outputs.next-version }}

    release:
        permissions:
            contents: write
            issues: write
            pull-requests: write
        runs-on: ubuntu-latest
        needs: get-next-version
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - name: Install dependencies
              run: yarn install --frozen-lockfile && cd game && yarn install --frozen-lockfile && cd ../

            - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
              run: yarn audit && cd game && yarn audit && cd ../

            - name: Setup aftman
              uses: ok-nick/setup-aftman@v0.4.2

            - name: Install aftman packages
              run: aftman install

            - name: Echoing version detected
              run: echo New version to update package.json to = "${{ needs.get-next-version.outputs.next-version }}"

            # Pre set package version... As of 7/23/2025 - release.config.js (@semantic-release/npm -> @semantic-release/git should also bump this version, but we manually set it here using the installed `npm` package since we need it to be updated for the build files)
            - name: Pre-setting package.json version from get-next-version
              if: needs.get-next-version.outputs.next-version != null
              run: yarn npm pkg set version=${{ needs.get-next-version.outputs.next-version }} && echo Manually updated package.json version to ${{ needs.get-next-version.outputs.next-version }}

            - name: Building
              run: yarn run build

            - name: Building Game
              run: yarn run build-game

            # Semantic release
            - name: Release
              run: npx semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Deploy Plugin file to Roblox
            # - name: Deploy to Roblox
            #   shell: bash
            #   env:
            #       PID: ${{ env.ROBLOX_PLUGIN_ID }} # Asset ID
            #       API_KEY: ${{ secrets.ROBLOX_GAME }}
            #       FILE: out/rutus_game.rbxm
            #   run: rbxcloud assets update -a "$API_KEY" -i "$PID" -t model-fbx -f "$FILE"

            # Deploy Plugin file to Itch.io
            - name: Delpoy to Itch
              uses: yeslayla/butler-publish-itchio-action@master
              env:
                  BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
                  CHANNEL: other
                  ITCH_GAME: ${{ env.ITCH_GAME_ID }}
                  ITCH_USER: ${{ env.ITCH_USERNAME }}
                  PACKAGE: out/rutus_plugin.rbxm
                  VERSION: ${{ needs.get-next-version.outputs.next-version }}

            # Deploy Experience/Game .rbxl file to Roblox
            # - name: Deploy Roblox Demo Place
            #   shell: bash
            #   env:
            #       UID: ${{ env.ROBLOX_UNIVERSE_ID }} # Universe ID
            #       PID: ${{ env.ROBLOX_PLACE_ID }} # Place ID
            #       API_KEY: ${{ secrets.ROBLOX_GAME }}
            #       FILE: game/out/rutus_game.rbxl # Roblox place file (e.g. might have a step before this to build the file with Rojo)
            #   run: rbxcloud experience publish -a "$API_KEY" -u "$UID" -i "$PID" -t published -f "$FILE"
